<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merged Orders Dashboard</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: #e4e7ec;
            --accent: #2563eb;
            --accent-soft: #eaf1ff;
            --error: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 64px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 40px);
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card);
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #12b76a;
            box-shadow: 0 0 0 4px #d1fadf;
        }

        .status.error {
            color: var(--error);
        }

        .status.error::before {
            background: var(--error);
            box-shadow: 0 0 0 4px #fee4e2;
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .card {
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(16, 24, 40, 0.06);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 13px 18px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f9fafb;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover td {
            background: #fcfdff;
        }

        td.number {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .empty {
            padding: 28px 18px;
            color: var(--muted);
            text-align: center;
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
                align-items: start;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>Merged Orders Dashboard</h1>
                <p class="subtitle">Live view of the SQLite pipeline output.</p>
            </div>
            <div id="status" class="status" aria-live="polite">Connecting…</div>
        </header>

        <div class="grid">
            <section class="card">
                <div class="card-header">
                    <h2>Merged Orders</h2>
                    <span class="tag">merged_orders</span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer ID</th>
                                <th>Customer</th>
                                <th>Region</th>
                                <th>Amount</th>
                                <th>Currency</th>
                                <th class="number">Amount CNY</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>Average by Region</h2>
                    <span class="tag">region_summary</span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Region</th>
                                <th class="number">Avg Amount CNY</th>
                            </tr>
                        </thead>
                        <tbody id="summary-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        const POLL_INTERVAL_MS = 2000;
        let currentVersion = null;

        const orderColumns = [
            { key: "order_id" },
            { key: "customer_id" },
            { key: "customer_name" },
            { key: "region" },
            { key: "amount", format: "money" },
            { key: "currency" },
            { key: "amount_cny", format: "money", className: "number" },
        ];

        const summaryColumns = [
            { key: "region" },
            { key: "average_amount_cny", format: "money", className: "number" },
        ];

        function formatMoney(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return value ?? "";
            return number.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });
        }

        function renderTable(tbodyId, rows, columns) {
            const tbody = document.getElementById(tbodyId);
            tbody.replaceChildren();

            if (!rows.length) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = columns.length;
                cell.className = "empty";
                cell.textContent = "No rows found.";
                row.appendChild(cell);
                tbody.appendChild(row);
                return;
            }

            for (const item of rows) {
                const row = document.createElement("tr");
                for (const column of columns) {
                    const cell = document.createElement("td");
                    const value = item[column.key];
                    cell.textContent = column.format === "money" ? formatMoney(value) : value ?? "";
                    if (column.className) cell.className = column.className;
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
            }
        }

        function setStatus(message, isError = false) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        async function refreshDashboard() {
            try {
                const response = await fetch("/api/dashboard", { cache: "no-store" });
                const data = await response.json();

                if (data.error) {
                    setStatus(data.error, true);
                    if (currentVersion !== data.version) {
                        currentVersion = data.version;
                        renderTable("orders-body", [], orderColumns);
                        renderTable("summary-body", [], summaryColumns);
                    }
                    return;
                }

                setStatus(`Live • updated ${new Date().toLocaleTimeString()}`);
                if (data.version === currentVersion) return;

                currentVersion = data.version;
                renderTable("orders-body", data.orders, orderColumns);
                renderTable("summary-body", data.summary, summaryColumns);
            } catch (error) {
                setStatus("Connection error. Retrying…", true);
            }
        }

        refreshDashboard();
        setInterval(refreshDashboard, POLL_INTERVAL_MS);
    </script>
</body>
</html>
