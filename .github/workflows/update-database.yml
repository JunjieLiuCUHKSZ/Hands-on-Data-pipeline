name: Update SQLite database

on:
  push:
    paths:
      - 'data/**'

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas Flask

      - name: Verify sqlite3 availability
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"

      - name: Run clean_and_merge script
        run: python clean_and_merge.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- clean_and_merge.db; then
            echo "Database unchanged."
            exit 0
          fi
          git add clean_and_merge.db
          git commit -m "Update SQLite database from data files"
          git push origin HEAD:${{ github.ref_name }}
